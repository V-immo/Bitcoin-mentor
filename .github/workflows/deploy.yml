name: Deploy naar server

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 202.71.14.150
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 24m
          script: |
            set -e
            cd /var/www/bitcoin-mentor

            # Code updaten
            git fetch origin main
            git reset --hard origin/main

            # Dependencies
            npm install --legacy-peer-deps

            # Migraties
            node db/init.js || true
            node db/migrate-goal.js || true
            node db/migrate-bitvavo.js || true
            node db/migrate-push.js || true
            node db/migrate-marcus-memory.js || true
            node db/migrate-alerts.js || true
            node db/ensure-admin.js || true
            node db/migrate-trading-knowledge.js || true
            node db/migrate-testnet.js || true
            node db/migrate-journal.js || true
            node db/migrate-weekly-review.js || true
            node db/migrate-2fa.js || true
            node db/migrate-journal-v2.js || true
            node db/migrate-premarket-count.js || true
            node db/migrate-bots.js || true
            node db/migrate-okx.js || true
            node db/migrate-mexc.js || true

            # Stop server + clean build dir (Turbopack race fix)
            pm2 delete bitcoin-mentor 2>/dev/null || true
            rm -rf .next

            # Build — max 3 pogingen door Turbopack race condition
            for attempt in 1 2 3; do
              echo "Build poging $attempt..."
              rm -rf .next
              NODE_OPTIONS='--max-old-space-size=1600' npm run build && break
              if [ $attempt -eq 3 ]; then
                echo "Build mislukt na 3 pogingen"
                exit 1
              fi
              sleep 5
            done

            pm2 delete bitcoin-mentor 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            echo "Deploy klaar"
