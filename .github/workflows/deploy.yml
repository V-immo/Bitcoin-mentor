name: Deploy naar server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 202.71.14.150
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/bitcoin-mentor
            git fetch origin main
            git merge --ff-only origin/main || (git stash && git merge --ff-only origin/main && git stash pop)
            npm install --legacy-peer-deps
            node db/init.js || true
            node db/migrate-goal.js || true
            node db/migrate-bitvavo.js || true
            node db/migrate-push.js || true
            node db/migrate-marcus-memory.js || true
            node db/ensure-admin.js || true
            npm run build
            pm2 restart bitcoin-mentor
