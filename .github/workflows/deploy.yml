name: Deploy naar server

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 202.71.14.150
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 14m
          script: |
            set -e
            cd /var/www/bitcoin-mentor

            # Code updaten
            git fetch origin main
            git reset --hard origin/main

            # Dependencies
            npm install --legacy-peer-deps

            # Migraties
            node db/init.js || true
            node db/migrate-goal.js || true
            node db/migrate-bitvavo.js || true
            node db/migrate-push.js || true
            node db/migrate-marcus-memory.js || true
            node db/migrate-alerts.js || true
            node db/ensure-admin.js || true
            node db/migrate-trading-knowledge.js || true
            node db/migrate-testnet.js || true
            node db/migrate-journal.js || true
            node db/migrate-weekly-review.js || true
            node db/migrate-2fa.js || true

            # .next clean — voorkomt ENOENT en stale cache bij elke deploy
            # PM2 blijft DRAAIEN tijdens de build zodat de site online blijft
            rm -rf .next

            # Build (oude versie serveert ondertussen nog)
            NODE_OPTIONS='--max-old-space-size=1400' npm run build

            # Herstart PM2 nu de build klaar is — downtime: seconden, niet minuten
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 reset bitcoin-mentor || true
            pm2 save

            echo "✅ Deploy klaar"
