name: Deploy naar server

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 202.71.14.150
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 14m
          script: |
            set -e
            cd /var/www/bitcoin-mentor

            # Code updaten
            git fetch origin main
            git reset --hard origin/main

            # Dependencies
            npm install --legacy-peer-deps

            # Migraties
            node db/init.js || true
            node db/migrate-goal.js || true
            node db/migrate-bitvavo.js || true
            node db/migrate-push.js || true
            node db/migrate-marcus-memory.js || true
            node db/migrate-alerts.js || true
            node db/ensure-admin.js || true
            node db/migrate-trading-knowledge.js || true
            node db/migrate-testnet.js || true
            node db/migrate-journal.js || true
            node db/migrate-weekly-review.js || true
            node db/migrate-2fa.js || true
            node db/migrate-journal-v2.js || true
            node db/migrate-premarket-count.js || true

            # Backup huidige werkende build — site blijft online tijdens build
            rm -rf .next-backup || true
            cp -r .next .next-backup 2>/dev/null || true

            # Build — stop server VOOR de build zodat .next niet gelockt is
            pm2 delete bitcoin-mentor 2>/dev/null || true
            rm -f .next/lock

            # Eerste poging: maakt .next/static/<hash>/ subdirectory aan (ook al faalt build)
            NODE_OPTIONS='--max-old-space-size=1600' npm run build || {
              echo "Eerste build mislukt (Turbopack race) — retry zonder rm -rf..."
              rm -f .next/lock
              NODE_OPTIONS='--max-old-space-size=1600' npm run build || {
                echo "Build mislukt na retry — herstel backup"
                rm -rf .next || true
                mv .next-backup .next || true
                exit 1
              }
            }

            # Build geslaagd — backup opruimen en starten
            rm -rf .next-backup || true

            pm2 start ecosystem.config.js --env production
            pm2 save

            echo "Deploy klaar"
