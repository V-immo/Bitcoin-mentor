name: Deploy naar server

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 202.71.14.150
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 24m
          script: |
            set -e
            cd /var/www/bitcoin-mentor

            # Code updaten
            git fetch origin main
            git reset --hard origin/main

            # Dependencies
            npm install --legacy-peer-deps

            # Migraties
            node db/init.js || true
            node db/migrate-goal.js || true
            node db/migrate-bitvavo.js || true
            node db/migrate-push.js || true
            node db/migrate-marcus-memory.js || true
            node db/migrate-alerts.js || true
            node db/ensure-admin.js || true
            node db/migrate-trading-knowledge.js || true
            node db/migrate-testnet.js || true
            node db/migrate-journal.js || true
            node db/migrate-weekly-review.js || true
            node db/migrate-2fa.js || true
            node db/migrate-journal-v2.js || true
            node db/migrate-premarket-count.js || true
            node db/migrate-bots.js || true
            node db/migrate-okx.js || true
            node db/migrate-mexc.js || true
            node db/migrate-learn-to-earn.js || true
            node db/migrate-signal-hash.js || true
            node db/migrate-copy-trading.js || true
            node db/migrate-wellness.js || true
            node db/migrate-leaderboard.js || true

            # Build terwijl de oude versie nog draait — site blijft online
            # Bouw naar tijdelijke map, wissel pas na succesvolle build
            rm -rf .next_new

            BUILD_OK=0
            for attempt in 1 2 3; do
              echo "Build poging $attempt..."
              rm -rf .next_new
              if NODE_OPTIONS='--max-old-space-size=1600' npm run build; then
                BUILD_OK=1
                break
              fi
              echo "Build poging $attempt mislukt, wacht 5s..."
              sleep 5
            done

            if [ $BUILD_OK -ne 1 ]; then
              echo "Build mislukt na 3 pogingen — site blijft op oude versie"
              exit 1
            fi

            # Cron jobs registreren (idempotent)
            CRON_REMINDER="0 19 * * * curl -s \"https://bitcoinmentor.be/api/cron/daily-reminder?secret=\$CRON_SECRET\" > /dev/null 2>&1"
            CRON_COMEBACK="0 9 * * * curl -s \"https://bitcoinmentor.be/api/cron/comeback?secret=\$CRON_SECRET\" > /dev/null 2>&1"
            CRON_DRIP="0 10 * * * curl -s \"https://bitcoinmentor.be/api/cron/drip-email?secret=\$CRON_SECRET\" > /dev/null 2>&1"
            (crontab -l 2>/dev/null | grep -v "drip-email\|daily-reminder\|comeback"; echo "$CRON_REMINDER"; echo "$CRON_COMEBACK"; echo "$CRON_DRIP") | crontab -

            # Build geslaagd — wissel nu snel
            pm2 delete bitcoin-mentor 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            echo "Deploy klaar"
