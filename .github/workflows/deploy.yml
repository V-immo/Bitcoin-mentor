name: Deploy naar server

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 202.71.14.150
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 14m
          script: |
            set -e
            cd /var/www/bitcoin-mentor

            # Code updaten
            git fetch origin main
            git reset --hard origin/main

            # Dependencies
            npm install --legacy-peer-deps

            # Migraties
            node db/init.js || true
            node db/migrate-goal.js || true
            node db/migrate-bitvavo.js || true
            node db/migrate-push.js || true
            node db/migrate-marcus-memory.js || true
            node db/migrate-alerts.js || true
            node db/ensure-admin.js || true
            node db/migrate-trading-knowledge.js || true
            node db/migrate-testnet.js || true
            node db/migrate-journal.js || true
            node db/migrate-weekly-review.js || true

            # Stop pm2 — site even offline (~2-3 min bouwtijd)
            pm2 stop bitcoin-mentor || true

            # Build
            NODE_OPTIONS='--max-old-space-size=1400' npm run build

            # Start pm2 — site weer online
            pm2 start bitcoin-mentor || pm2 start ecosystem.config.js
            pm2 save

            echo "✅ Deploy klaar"
